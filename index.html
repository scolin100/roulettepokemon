<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roulette</title>
<style>
  :root { color-scheme: dark; --blue:#4169E1; --orange:#FF8C00; --acc-rgb:255,140,0; --glow:rgba(150,185,255,.55); --glow-l:rgba(150,185,255,.4); --vig:rgba(10,25,110,.6); --card:rgba(10,20,70,.55); --card2:rgba(10,20,70,.35); --ray:rgba(255,255,255,.10); --cw:800px; --ch:420px; --ww:820px; --wh:1000px; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#0b0d12; font-family: system-ui, Segoe UI, Arial, sans-serif; color:#fff; overflow:hidden; }
  body { display:flex; }

  /* ---------- zone de la roue (1080x1920, mise à l'échelle pour tenir à l'écran) ---------- */
  #area { flex:1; position:relative; min-width:0; overflow:hidden; }
  #stage { position:absolute; left:50%; top:50%; width:1080px; height:1920px; transform-origin:center center;
           background:var(--blue); overflow:hidden; }
  #cards { position:absolute; inset:0; }
  .card { position:absolute; left:50%; top:50%; width:var(--cw); height:var(--ch);
          transform:translate(-50%,-50%); border-radius:24px; overflow:hidden;
          background:var(--card); box-shadow:0 10px 30px rgba(0,0,0,.35);
          display:flex; flex-direction:column; }
  .pic { flex:1; min-height:0; padding:34px 70px; display:flex; align-items:center; justify-content:center; }
  .pic img { width:100%; height:100%; object-fit:contain; display:block; }
  .pic img { image-rendering:auto; }

  /* ---------- fond animé ---------- */
  #bg { position:absolute; inset:0; overflow:hidden;
        background:
          radial-gradient(ellipse at 50% 45%, var(--glow) 0%, transparent 62%),
          radial-gradient(ellipse at 50% 50%, transparent 55%, var(--vig) 100%); }
  #rays { position:absolute; left:50%; top:50%; width:3400px; height:3400px; margin:-1700px 0 0 -1700px;
          background:repeating-conic-gradient(var(--ray) 0deg 8deg, transparent 8deg 16deg);
          -webkit-mask-image:radial-gradient(circle, #000 0%, transparent 62%);
          mask-image:radial-gradient(circle, #000 0%, transparent 62%);
          animation:raysSpin 120s linear infinite; }
  @keyframes raysSpin { to { transform:rotate(360deg); } }
  .bubble { position:absolute; bottom:-220px; border-radius:50%; border:3px solid rgba(255,255,255,.35);
            background:rgba(255,255,255,.08); animation:rise linear infinite; }
  @keyframes rise { 0% { transform:translateY(0); opacity:0; } 10% { opacity:1; } 90% { opacity:1; } 100% { transform:translateY(-2400px); opacity:0; } }
  /* le nom reste caché pendant la rotation, il n'apparaît qu'au résultat final */
  .label { height:0; opacity:0; line-height:150px; text-align:center; font-weight:800; font-size:80px; color:var(--orange);
           text-transform:uppercase; white-space:nowrap; overflow:hidden; overflow-wrap:anywhere; padding:0 24px;
           display:flex; align-items:center; justify-content:center;
           text-shadow:-3px -3px 0 #000, 3px -3px 0 #000, -3px 3px 0 #000, 3px 3px 0 #000,
                       0 -3px 0 #000, 0 3px 0 #000, -3px 0 0 #000, 3px 0 0 #000; }

  /* cadre de sélection */
  #frame { position:absolute; left:50%; top:50%; width:calc(var(--cw) + 44px); height:calc(var(--ch) + 44px);
           transform:translate(-50%,-50%); border:6px solid var(--orange); border-radius:32px; pointer-events:none;
           transition:width .9s ease, height .9s ease; }
  #frame::before, #frame::after { content:""; position:absolute; top:50%; margin-top:-18px; border-style:solid; transition:opacity .4s; }
  #frame::before { left:-34px; border-width:18px 0 18px 22px; border-color:transparent transparent transparent var(--orange); }
  #frame::after  { right:-34px; border-width:18px 22px 18px 0; border-color:transparent var(--orange) transparent transparent; }


  /* ---------- état final : le gagnant grandit, les autres s'effacent ---------- */
  #stage.done .card { transition:opacity .7s ease, width .9s ease, height .9s ease; }
  #stage.done .card:not(.win) { opacity:0 !important; }
  #stage.done .card.win { width:var(--ww); height:var(--wh); background:var(--card2); z-index:5; }
  #stage.done .card.win .pic { padding:60px 50px 0; }
  #stage.done .card.win .label { height:150px; opacity:1; transition:height .9s ease, opacity .9s ease .3s; }
  #stage.done #frame { width:calc(var(--ww) + 44px); height:calc(var(--wh) + 44px); }
  #stage.done #frame::before, #stage.done #frame::after { opacity:0; }

  /* ---------- effet de victoire : confettis + halo lumineux qui pulse ---------- */
  #fx { position:absolute; left:0; top:0; width:1080px; height:1920px; pointer-events:none; z-index:10; }
  @keyframes winGlow {
    0%   { box-shadow:0 0 0 0 rgba(var(--acc-rgb),.9), 0 0 0 0 rgba(255,255,255,.7); }
    60%  { box-shadow:0 0 90px 30px rgba(var(--acc-rgb),.75), 0 0 160px 60px rgba(255,255,255,.35); }
    100% { box-shadow:0 0 40px 10px rgba(var(--acc-rgb),.45), 0 0 80px 20px rgba(255,255,255,.12); }
  }
  #stage.done #frame { animation:winGlow 1.4s ease-out forwards; }

  /* ---------- panneau de commandes à droite ---------- */
  #panel { width:230px; flex:none; background:#12151d; border-left:1px solid #2a3042; padding:16px 14px;
           display:flex; flex-direction:column; gap:14px; }
  #panel.hidden { display:none; }
  button, label.btn { background:#1e2432; color:#fff; border:1px solid #3a4258; border-radius:8px; padding:10px 12px;
                      font-size:14px; cursor:pointer; text-align:center; }
  button:hover, label.btn:hover { background:#2a3248; }
  #spin { background:var(--orange); color:#111; font-weight:700; border-color:var(--orange); font-size:17px; padding:14px 12px; }
  #spin:disabled { opacity:.5; cursor:default; }
  #info { font-size:13px; opacity:.85; line-height:1.4; }
  .opt { font-size:14px; display:flex; gap:8px; align-items:center; }
  .hint { font-size:12px; opacity:.5; margin-top:auto; }

  /* ---------- fenêtre de gestion de la mémoire ---------- */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:flex; align-items:center; justify-content:center; z-index:50; }
  .modal.hidden { display:none; }
  .box { width:min(540px, 94vw); height:min(82vh, 720px); background:#12151d; border:1px solid #2a3042; border-radius:12px;
         padding:16px; display:flex; flex-direction:column; gap:10px; }
  .mhead { display:flex; justify-content:space-between; align-items:center; font-size:17px; }
  .tabs { display:flex; gap:8px; }
  .tabs button { flex:1; }
  .tabs button.on { background:var(--orange); color:#111; border-color:var(--orange); font-weight:700; }
  #memSearch { background:#1e2432; color:#fff; border:1px solid #3a4258; border-radius:8px; padding:10px 12px; font-size:15px; }
  #memList { flex:1; overflow:auto; border:1px solid #2a3042; border-radius:8px; }
  .row { display:flex; justify-content:space-between; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px solid #1f2535; font-size:14px; }
  .row span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .row button { padding:5px 10px; font-size:13px; flex:none; }
  #histList { flex:1; overflow:auto; border:1px solid #2a3042; border-radius:8px; }
  .row .num { flex:none; width:34px; opacity:.5; }
  .row .nm { flex:1; min-width:0; font-weight:600; }
  .row small { flex:none; opacity:.6; font-size:12px; }
  .empty { padding:20px; text-align:center; opacity:.6; font-size:14px; }
  .mfoot { display:flex; justify-content:space-between; align-items:center; gap:10px; font-size:12px; opacity:.9; }
  input[type=file] { display:none; }

  /* ---------- structure du panneau (bureau) ---------- */
  #bottomBar { display:contents; }
  #optToggle, .grab, #sheetBack { display:none; }
  #opts { display:flex; flex-direction:column; gap:14px; flex:1; }
  @supports (height:100dvh) { html, body { height:100dvh; } }

  /* ---------- VERSION MOBILE : bouton TIRER en bas, options dans un onglet qui monte du bas ---------- */
  @media (max-width: 820px), (max-height: 520px) {
    body { flex-direction:column; }
    #area { background:var(--blue); }
    #panel { width:100%; border-left:none; border-top:1px solid #2a3042; flex-direction:row; gap:0;
             padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
    #bottomBar { display:flex; gap:10px; width:100%; }
    #spin { flex:1; padding:16px 12px; font-size:21px; border-radius:12px; }
    #spin small { display:none; }
    #optToggle { display:block; flex:none; width:68px; font-size:24px; border-radius:12px; padding:0; }
    #sheetBack { display:block; position:fixed; inset:0; background:rgba(0,0,0,.55); opacity:0; pointer-events:none;
                 transition:opacity .3s; z-index:39; }
    #sheetBack.show { opacity:1; pointer-events:auto; }
    #opts { position:fixed; left:0; right:0; bottom:0; max-height:75%; overflow:auto; flex:none;
            background:#12151d; border-top:1px solid #2a3042; border-radius:18px 18px 0 0;
            padding:12px 18px calc(22px + env(safe-area-inset-bottom)); z-index:40;
            transform:translateY(105%); transition:transform .3s ease; box-shadow:0 -12px 30px rgba(0,0,0,.5); }
    #opts.open { transform:translateY(0); }
    .grab { display:block; width:44px; height:5px; border-radius:3px; background:#3a4258; margin:0 auto 6px; }
    #opts button, #opts label.btn { padding:14px 12px; font-size:16px; }
    .opt { font-size:16px; padding:6px 0; }
    #info { font-size:14px; }
    .hint { display:none; }
  }

  /* ---------- liens réseaux sociaux ---------- */
  .social { display:flex; flex-direction:column; gap:10px; }
  .social .stitle { font-size:12px; opacity:.75; margin-bottom:2px; }
  .social a { display:flex; align-items:center; gap:9px; text-decoration:none; color:#fff; background:rgba(18,21,29,.88);
              border:1px solid #3a4258; border-radius:999px; padding:14px 26px; font-size:19px; font-weight:600; }
  .social a:hover { background:#2a3248; }
  .social i { width:14px; height:14px; border-radius:50%; background:var(--c); flex:none; }
  #socialFixed { position:fixed; left:12px; bottom:12px; z-index:20; }   /* bas gauche, version PC */
  #opts .social { display:none; }                                       /* panneau : visible seulement sur mobile */
  @media (max-width: 820px), (max-height: 520px) {
    #socialFixed { display:none; }
    #opts .social { display:flex; flex-direction:row; flex-wrap:wrap; align-items:center; gap:8px; }
    #opts .social .stitle { width:100%; font-size:14px; }
    #opts .social a { padding:11px 16px; font-size:15px; }
  }

  /* ---------- mode léger (mobile / appareils modestes) : on supprime les effets coûteux ---------- */
  html.lite #rays { display:none; }
  html.lite .bubble { border:none; background:rgba(255,255,255,.10); }
  html.lite .card { box-shadow:none; }
  html.lite #bg { background:radial-gradient(ellipse at 50% 45%, var(--glow-l) 0%, transparent 62%); }
  /* bulles personnalisées (bulle.png) */
  html .bubble.custom { border:none; border-radius:0; background-color:transparent; background-size:contain;
                        background-repeat:no-repeat; background-position:center; }

  /* ---------- thèmes ---------- */
  html[data-theme="halloween"] { --blue:#24103f; --orange:#FF7A00; --acc-rgb:255,122,0; --glow:rgba(255,122,0,.38); --glow-l:rgba(255,122,0,.28);
    --vig:rgba(0,0,0,.68); --card:rgba(12,4,26,.62); --card2:rgba(12,4,26,.45); --ray:rgba(255,140,0,.10); }
  html[data-theme="noel"] { --blue:#0f5a3a; --orange:#FFD34D; --acc-rgb:255,211,77; --glow:rgba(255,245,200,.45); --glow-l:rgba(255,245,200,.32);
    --vig:rgba(0,35,18,.62); --card:rgba(4,38,24,.6); --card2:rgba(4,38,24,.4); --ray:rgba(255,255,255,.10); }
  html .bubble.emo { border:none; border-radius:0; background:none; text-align:center; }
  html .bubble.fall { bottom:auto; top:-220px; animation-name:fall; }
  @keyframes fall { 0% { transform:translate(0,0) rotate(0deg); opacity:0; } 10% { opacity:1; } 90% { opacity:1; }
                    100% { transform:translate(70px,2400px) rotate(200deg); opacity:0; } }
  #themeSel { width:100%; background:#1e2432; color:#fff; border:1px solid #3a4258; border-radius:8px; padding:10px 12px; font-size:14px; }
  .themeRow label { display:block; margin-bottom:6px; font-size:14px; }
  @media (max-width: 820px), (max-height: 520px) { #themeSel { padding:14px 12px; font-size:16px; } }
</style>
</head>
<body>

  <div id="stage">

    <div id="cards"></div>

<div id="panel">

    <a href="https://x.com/scolin100" target="_blank" rel="noopener noreferrer" style="--c:#ffffff"><i></i>X/scolin100</a>
  <a href="https://www.tiktok.com/@scolin100" target="_blank" rel="noopener noreferrer" style="--c:#fe2c55"><i></i>Tiktok/scolin100</a>

    <div class="tabs"><button id="tabRem" class="on">Retirées (0)</button><button id="tabAv">Disponibles (0)</button></div>

    <div class="mfoot"><span style="display:flex;gap:8px"><button id="histCopy">Copier la liste</button><button id="histClear">Effacer</button></span><span id="histNote"></span></div>
  </div>
</div>

<!-- liste.js est généré par creer_liste.bat (liste des fichiers du dossier allpokemon) -->
<script src="liste.js"></script>
<script>
// ====== RÉGLAGES ======
const W = 1080, H = 1920;
const FOLDER = "allpokemon";   // dossier d'images, à côté de roulette.html
const LITE = matchMedia('(pointer: coarse)').matches || /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);   // uniquement téléphones / tablettes
document.documentElement.classList.toggle('lite', LITE);   // mode léger sur mobile
const LOAD_COUNT = LITE ? 24 : 40;         // images chargées au hasard à chaque lancement
const CARD_W = 800, CARD_H = 420, GAP = 30;
const SPIN_MS = 7500;
// =======================

const PITCH = CARD_H + GAP;
const $ = id => document.getElementById(id);
const stage = $('stage'), cardsEl = $('cards'), spinBtn = $('spin'), info = $('info');
const IMG_RE = /\.(gif|png|jpe?g|webp|avif|bmp)$/i;
const cleanName = n => n.replace(/\.[^.]+$/, '');

let all = [];        // {name, src} ou {name, file}
let strip = [];      // {name, src, entry, nw, nh, el}
let offset = 0, state = 'idle', winnerIdx = -1, startT = 0, targetOffset = 0, lastTick = -1;
let objectUrls = [];

// ---- mémoire des images retirées (conservée entre les rechargements) ----
const MEM_KEY = 'roulette_images_retirees';
function loadRemoved() {
  try { return new Set(JSON.parse(localStorage.getItem(MEM_KEY) || '[]')); } catch (e) { return new Set(); }
}
function saveRemoved() {
  try { localStorage.setItem(MEM_KEY, JSON.stringify([...removed])); } catch (e) {}
  updateMemBtn();
}
const removed = loadRemoved();
let fullList = [];   // toutes les images du dossier, y compris celles retirées
function updateMemBtn() { $('resetMem').textContent = '↺ Réinitialiser la mémoire (' + removed.size + ' retirées)'; }

// ---- mise à l'échelle de la scène 1080x1920 ----
function fit() {
  const a = $('area');
  const s = Math.min(a.clientWidth / W, a.clientHeight / H);
  stage.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
}
addEventListener('resize', fit);

// ---- liste des images ----
function initFromManifest() {
  const list = window.POKEMON_LIST;
  if (Array.isArray(list) && list.length) {
    all = list.filter(n => IMG_RE.test(n)).map(n => ({ id: n, name: cleanName(n), src: FOLDER + '/' + encodeURIComponent(n) }));
    ready();
  } else {
    info.textContent = "Liste introuvable : lance creer_liste.bat à côté du dossier, ou choisis le dossier à la main.";
    $('pickLabel').style.display = '';
  }
}
$('folder').onchange = e => {
  all = [...e.target.files].filter(f => IMG_RE.test(f.name)).map(f => ({ id: f.name, name: cleanName(f.name), file: f }));
  if (all.length) ready(); else info.textContent = "Aucune image trouvée dans ce dossier";
};
function ready() {
  fullList = all.slice();
  const before = all.length;
  all = all.filter(e => !removed.has(e.id));      // exclut les images déjà retirées lors des sessions précédentes
  const hidden = before - all.length;
  updateMemBtn();
  if (!all.length) {
    spinBtn.disabled = true;
    info.textContent = "Plus aucune image disponible (" + hidden + " retirées) — utilise « Réinitialiser la mémoire ».";
    return;
  }
  info.textContent = all.length + " images disponibles" + (hidden ? " (" + hidden + " déjà retirées)" : "") +
    " — " + Math.min(LOAD_COUNT, all.length) + " tirées au hasard à chaque lancement";
  spinBtn.disabled = false;
  showIdle();
}

// ---- chargement aléatoire ----
function sample(arr, n) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a.slice(0, n);
}
function loadEntry(entry) {
  return new Promise(res => {
    let src = entry.src;
    if (entry.file) { src = URL.createObjectURL(entry.file); objectUrls.push(src); }
    const img = new Image();
    img.onload = () => res({ name: entry.name, src, entry, nw: img.naturalWidth, nh: img.naturalHeight });
    img.onerror = () => res(null);
    img.src = src;
  });
}
async function loadRandom(n) {
  return (await Promise.all(sample(all, n).map(loadEntry))).filter(Boolean);
}
function rnd(n) { return Math.floor(Math.random() * n); }
function buildStrip(loaded, len) {
  // Une même image ne peut pas réapparaître avant au moins `gap` cartes : plus de doublons visibles en même temps.
  const out = [], recent = [];
  const gap = Math.min(12, loaded.length - 1);
  for (let i = 0; i < len; i++) {
    let p;
    do { p = loaded[rnd(loaded.length)]; } while (gap > 0 && recent.includes(p));
    out.push(Object.assign({}, p));
    recent.push(p); if (recent.length > gap) recent.shift();
  }
  return out;
}
function renderStrip() {
  cardsEl.innerHTML = '';
  strip.forEach(it => {
    const card = document.createElement('div'); card.className = 'card'; card.style.display = 'none';
    const pic = document.createElement('div'); pic.className = 'pic';
    const lab = document.createElement('div'); lab.className = 'label'; lab.textContent = it.name;
    card.appendChild(pic); card.appendChild(lab);
    cardsEl.appendChild(card);
    it.el = card; it.pic = pic; it.img = null; it.vis = false;   // l'image n'est créée que quand la carte approche de l'écran
  });
}
// Perf : seules les cartes proches de l'écran ont une image (un GIF animé = coûteux). Les autres n'en ont pas.
const V_SHOW = H / 2 + CARD_H, V_LOAD = H / 2 + CARD_H * 3, V_DROP = V_LOAD + PITCH * 2;
function render() {
  for (let i = 0; i < strip.length; i++) {
    const it = strip[i], el = it.el, d = i * PITCH - offset, ad = Math.abs(d);
    if (ad < V_LOAD) {
      if (!it.img) {
        const img = new Image(); img.alt = ''; img.decoding = 'async'; img.src = it.src;
        if (img.decode) img.decode().catch(() => {});          // décode à l'avance pour éviter les saccades à l'apparition
        it.pic.appendChild(img); it.img = img;
      }
    } else if (ad > V_DROP && it.img) { it.img.remove(); it.img = null; }   // libère le GIF déjà passé
    if (ad > V_SHOW) { if (it.vis) { el.style.display = 'none'; it.vis = false; } continue; }
    if (!it.vis) { el.style.display = ''; it.vis = true; }
    const dist = Math.min(ad / (H / 2), 1);
    el.style.transform = 'translate3d(-50%,-50%,0) translate3d(0,' + d + 'px,0) scale(' + (1 - dist * 0.22) + ')';
    el.style.opacity = 1 - dist * 0.55;
  }
}

async function showIdle() {
  state = 'loading';
  const loaded = await loadRandom(Math.min(10, all.length));
  if (!loaded.length) { info.textContent = "Impossible de charger les images (vérifie le dossier « " + FOLDER + " »)"; state = 'idle'; return; }
  stage.classList.remove('done');
  strip = buildStrip(loaded, 10); renderStrip(); offset = 4 * PITCH; winnerIdx = -1; render();
  state = 'idle';
}

// ---- tirage ----
async function spin() {
  if (state === 'spinning' || state === 'loading' || !all.length) return;
  initAudio();
  state = 'loading'; spinBtn.disabled = true;
  const old = objectUrls; objectUrls = [];
  const loaded = await loadRandom(Math.min(LOAD_COUNT, all.length));
  if (!loaded.length) { state = 'idle'; spinBtn.disabled = false; info.textContent = "Erreur de chargement des images"; return; }
  stage.classList.remove('done'); stopFx();
  const K = 48 + rnd(10);
  strip = buildStrip(loaded, K + 6); renderStrip();
  old.forEach(u => URL.revokeObjectURL(u));
  winnerIdx = K; offset = 0; render();
  targetOffset = K * PITCH + (Math.random() - 0.5) * CARD_H * 0.5;
  startT = performance.now(); lastTick = -1;
  state = 'spinning';
  requestAnimationFrame(loop);
}
function loop(now) {
  const t = Math.min((now - startT) / SPIN_MS, 1);
  offset = targetOffset * (1 - Math.pow(1 - t, 4));
  const idx = Math.floor((offset + PITCH / 2) / PITCH);
  if (idx !== lastTick) { lastTick = idx; tick(); }
  render();
  if (t < 1) requestAnimationFrame(loop); else finish();
}
function finish() {
  const from = offset, to = winnerIdx * PITCH, s = performance.now();
  (function snap(n) {
    const k = Math.min((n - s) / 400, 1);
    offset = from + (to - from) * (1 - Math.pow(1 - k, 3));
    render();
    if (k < 1) { requestAnimationFrame(snap); return; }
    // le gagnant devient grand, les autres s'effacent
    const win = strip[winnerIdx];
    fitLabel(win.el.querySelector('.label'));
    win.el.classList.add('win');
    win.el.style.transform = 'translate(-50%,-50%) translateY(0px) scale(1)';
    win.el.style.opacity = 1;
    stage.classList.add('done');
    state = 'done'; fanfare();
    addHistory(win);
    burst();
    if ($('remove').checked) {
      all = all.filter(e => e !== win.entry);
      removed.add(win.entry.id); saveRemoved();
      info.textContent = all.length + " images restantes";
    }
    spinBtn.disabled = all.length === 0;
  })(s);
}

// ajuste la taille du nom pour qu'il tienne en entier (réduit la police, puis passe sur 2 lignes si besoin)
function fitLabel(el) {
  const text = el.textContent.toUpperCase();
  const avail = 820 - 48 - 10;                       // largeur de la carte finale moins marges et contour
  const c = document.createElement('canvas').getContext('2d');
  const fam = getComputedStyle(el).fontFamily;
  const w = s => { c.font = '800 ' + s + 'px ' + fam; return c.measureText(text).width; };
  let s = 80;
  while (s > 40 && w(s) > avail) s -= 2;
  if (w(s) <= avail) {                               // tient sur une ligne
    el.style.fontSize = s + 'px'; el.style.lineHeight = '150px'; el.style.whiteSpace = 'nowrap'; return;
  }
  s = 64;                                            // sinon : deux lignes
  while (s > 28 && w(s) > avail * 1.8) s -= 2;
  el.style.fontSize = s + 'px'; el.style.lineHeight = '1.1'; el.style.whiteSpace = 'normal';
}

// ---- sons ----
let ac;
function initAudio() { try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); ac.resume(); } catch (e) {} }
// ---- bouton son (mémorisé entre les visites) ----
let muted = false;
try { muted = localStorage.getItem('roulette_muet') === '1'; } catch (e) {}
function updateSoundBtn() { $('soundBtn').textContent = muted ? '🔇 Son coupé' : '🔊 Son activé'; }
$('soundBtn').onclick = () => {
  muted = !muted;
  try { localStorage.setItem('roulette_muet', muted ? '1' : '0'); } catch (e) {}
  updateSoundBtn();
};
updateSoundBtn();
function tick() {
  if (muted || !ac) return;
  const o = ac.createOscillator(), g = ac.createGain();
  o.type = 'square'; o.frequency.value = 900; g.gain.setValueAtTime(.05, ac.currentTime);
  g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + .05);
  o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .06);
}
function fanfare() {
  if (muted || !ac) return;
  [523, 659, 784, 1047].forEach((f, i) => {
    const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i * .11;
    o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(.12, t);
    g.gain.exponentialRampToValueAtTime(.0001, t + .35);
    o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + .4);
  });
}

// ---- gestionnaire de mémoire : retirer / remettre des images à la main ----
let memTab = 'rem';
const MEM_MAX = 300;
function refreshAfterMem() {
  all = fullList.filter(e => !removed.has(e.id));
  const hidden = fullList.length - all.length;
  info.textContent = all.length + " images disponibles" + (hidden ? " (" + hidden + " retirées)" : "") +
    " — " + Math.min(LOAD_COUNT, all.length) + " tirées au hasard à chaque lancement";
  spinBtn.disabled = all.length === 0 || state === 'spinning' || state === 'loading';
  if (all.length && !strip.length && state === 'idle') showIdle();
}
function toggleMem(id) {
  if (removed.has(id)) removed.delete(id); else removed.add(id);
  saveRemoved(); refreshAfterMem(); renderMem(true);
}
function renderMem(keepScroll) {
  const list = $('memList'), top = list.scrollTop;
  const q = $('memSearch').value.trim().toLowerCase();
  const byName = (a, b) => a.localeCompare(b);
  const remList = [...removed].sort(byName);
  const avList = fullList.filter(e => !removed.has(e.id)).map(e => e.id).sort(byName);
  $('tabRem').textContent = 'Retirées (' + remList.length + ')';
  $('tabAv').textContent = 'Disponibles (' + avList.length + ')';
  $('tabRem').classList.toggle('on', memTab === 'rem');
  $('tabAv').classList.toggle('on', memTab === 'av');
  const filtered = (memTab === 'rem' ? remList : avList).filter(id => cleanName(id).toLowerCase().includes(q));
  list.innerHTML = '';
  if (!filtered.length) {
    const d = document.createElement('div'); d.className = 'empty';
    d.textContent = (memTab === 'av' && !fullList.length) ? "Aucune liste chargée" : "Aucune image";
    list.appendChild(d);
  }
  filtered.slice(0, MEM_MAX).forEach(id => {
    const row = document.createElement('div'); row.className = 'row';
    const s = document.createElement('span'); s.textContent = cleanName(id); s.title = id;
    const b = document.createElement('button'); b.textContent = memTab === 'rem' ? 'Remettre' : 'Retirer';
    b.onclick = () => toggleMem(id);
    row.appendChild(s); row.appendChild(b); list.appendChild(row);
  });
  $('memNote').textContent = filtered.length > MEM_MAX
    ? "300 premiers sur " + filtered.length + " — affine la recherche"
    : filtered.length + " résultat(s)";
  list.scrollTop = keepScroll ? top : 0;
}
function openMem() { closeSheet(); $('mem').classList.remove('hidden'); renderMem(); $('memSearch').focus(); }
function closeMem() { $('mem').classList.add('hidden'); }
$('manageMem').onclick = openMem;
$('memClose').onclick = closeMem;
$('mem').addEventListener('mousedown', e => { if (e.target === $('mem')) closeMem(); });
$('tabRem').onclick = () => { memTab = 'rem'; renderMem(); };
$('tabAv').onclick = () => { memTab = 'av'; renderMem(); };
$('memSearch').oninput = () => renderMem();
$('memAll').onclick = () => {
  if (!removed.size) return;
  if (confirm("Remettre dans la roue les " + removed.size + " images retirées ?")) {
    removed.clear(); saveRemoved(); refreshAfterMem(); renderMem();
  }
};

$('resetMem').onclick = () => {
  if (!removed.size) return;
  if (confirm("Remettre dans la roue les " + removed.size + " images retirées ?")) {
    removed.clear(); saveRemoved(); location.reload();
  }
};
updateMemBtn();
// ---- effet de victoire : confettis ----
const fxCv = $('fx'), fxCtx = fxCv.getContext('2d');
let fxId = 0;
function stopFx() { fxId++; fxCtx.clearRect(0, 0, W, H); }
function burst() {
  stopFx();
  const id = fxId, cols = THEMES[curTheme].conf;
  const parts = [];
  function spawn(n, delay) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 14 + Math.random() * 26;
      parts.push({ x: W / 2, y: H / 2, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 8,
        w: 12 + Math.random() * 16, h: 7 + Math.random() * 9, r: Math.random() * 6.28, vr: (Math.random() - .5) * .5,
        c: cols[rnd(cols.length)], tilt: Math.random() * 6.28, t0: performance.now() + delay });
    }
  }
  const n = LITE ? 70 : 170;
  spawn(n, 0); spawn(Math.round(n * .5), 450);
  const T = 4200;
  (function step(now) {
    if (id !== fxId) return;
    fxCtx.clearRect(0, 0, W, H);
    let alive = false;
    for (const p of parts) {
      const age = now - p.t0;
      if (age < 0) { alive = true; continue; }
      if (age > T || p.y > H + 60) continue;
      alive = true;
      p.vy += 0.55; p.vx *= 0.992; p.vy *= 0.992;
      p.x += p.vx; p.y += p.vy; p.r += p.vr; p.tilt += .15;
      fxCtx.save();
      fxCtx.globalAlpha = Math.min(1, (T - age) / 900);
      fxCtx.translate(p.x, p.y); fxCtx.rotate(p.r); fxCtx.scale(1, Math.cos(p.tilt));
      fxCtx.fillStyle = p.c; fxCtx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
      fxCtx.restore();
    }
    if (alive) requestAnimationFrame(step); else fxCtx.clearRect(0, 0, W, H);
  })(performance.now());
}

// ---- historique des tirages (conservé entre les visites) ----
const HIST_KEY = 'roulette_historique', HIST_MAX = 200;
let history = [];
try { history = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) { history = []; }
function saveHist() { try { localStorage.setItem(HIST_KEY, JSON.stringify(history)); } catch (e) {} }
function addHistory(win) {
  history.unshift({ n: win.name, t: Date.now() });
  if (history.length > HIST_MAX) history.length = HIST_MAX;
  saveHist();
  if (!$('hist').classList.contains('hidden')) renderHist();
}
function fmtDate(t) {
  return new Date(t).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function renderHist() {
  const list = $('histList'); list.innerHTML = '';
  if (!history.length) {
    const d = document.createElement('div'); d.className = 'empty'; d.textContent = "Aucun tirage pour l'instant";
    list.appendChild(d);
  }
  history.forEach((h, i) => {
    const row = document.createElement('div'); row.className = 'row';
    const num = document.createElement('span'); num.className = 'num'; num.textContent = '#' + (history.length - i);
    const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = h.n;
    const tm = document.createElement('small'); tm.textContent = fmtDate(h.t);
    row.appendChild(num); row.appendChild(nm); row.appendChild(tm); list.appendChild(row);
  });
  $('histNote').textContent = history.length + " tirage(s)" + (history.length >= HIST_MAX ? " (" + HIST_MAX + " derniers)" : "");
  list.scrollTop = 0;
}
function openHist() { closeSheet(); $('hist').classList.remove('hidden'); renderHist(); }
function closeHist() { $('hist').classList.add('hidden'); }
$('histBtn').onclick = openHist;
$('histClose').onclick = closeHist;
$('hist').addEventListener('mousedown', e => { if (e.target === $('hist')) closeHist(); });
$('histClear').onclick = () => {
  if (!history.length) return;
  if (confirm("Effacer les " + history.length + " tirages de l'historique ?")) { history = []; saveHist(); renderHist(); }
};
$('histCopy').onclick = async () => {
  const txt = history.map((h, i) => '#' + (history.length - i) + ' ' + h.n + ' (' + fmtDate(h.t) + ')').join('\n');
  try { await navigator.clipboard.writeText(txt); $('histCopy').textContent = 'Copié ✓'; }
  catch (e) { $('histCopy').textContent = 'Copie impossible'; }
  setTimeout(() => $('histCopy').textContent = 'Copier la liste', 1500);
};

// ---- onglet d'options (version mobile) ----
function openSheet() { $('opts').classList.add('open'); $('sheetBack').classList.add('show'); }
function closeSheet() { $('opts').classList.remove('open'); $('sheetBack').classList.remove('show'); }
$('optToggle').onclick = () => $('opts').classList.contains('open') ? closeSheet() : openSheet();
$('sheetBack').onclick = closeSheet;
spinBtn.onclick = () => { closeSheet(); spin(); };
addEventListener('keydown', e => {
  if (!$('mem').classList.contains('hidden')) { if (e.key === 'Escape') closeMem(); return; }  // fenêtre mémoire ouverte
  if (!$('hist').classList.contains('hidden')) { if (e.key === 'Escape') closeHist(); return; } // fenêtre historique ouverte
  if (e.code === 'Space') { e.preventDefault(); if (!spinBtn.disabled) spin(); }
  if (e.key.toLowerCase() === 'h') { $('panel').classList.toggle('hidden'); fit(); }
});
// bulles qui montent doucement dans le fond
// ---- thèmes : Par défaut / Halloween / Noël (Auto = selon la date) ----
const THEMES = {
  default:   { name: 'Par défaut', conf: ['#FF8C00', '#FFD34D', '#ffffff', '#7fb0ff', '#ff5a7a', '#7dffb2'], emo: null },
  halloween: { name: 'Halloween 🎃', conf: ['#FF7A00', '#ffb347', '#ffffff', '#9b5de5', '#c77dff', '#7dff5a'], emo: ['🎃', '🦇', '👻', '🕸️', '🎃', '🦇'], fall: false },
  noel:      { name: 'Noël 🎄', conf: ['#e63946', '#2a9d5c', '#FFD34D', '#ffffff', '#c1121f', '#7fd1ae'], emo: ['❄️', '❄️', '❄️', '⭐', '🎄', '⛄'], fall: true }
};
const THEME_KEY = 'roulette_theme';
let themeChoice = 'auto';
try { themeChoice = localStorage.getItem(THEME_KEY) || 'auto'; } catch (e) {}
if (themeChoice !== 'auto' && !THEMES[themeChoice]) themeChoice = 'auto';
// Thème automatique : actif 7 jours avant la date et jusqu'à 2 jours après (inclus)
function inWindow(month, day, now) {
  const y = now.getFullYear();
  return now >= new Date(y, month, day - 7) && now <= new Date(y, month, day + 2, 23, 59, 59, 999);
}
function autoTheme(now) {
  now = now || new Date();
  if (inWindow(9, 31, now)) return 'halloween';    // Halloween : 24 oct → 2 nov
  if (inWindow(11, 25, now)) return 'noel';        // Noël : 18 déc → 27 déc
  return 'default';
}
let curTheme = 'default', customBubble = null, customTested = false, decorSeq = 0;
// Décor : bulles rondes (ou bulle.png si présent) en thème par défaut, emojis en Halloween / Noël
function buildDecor() {
  const seq = ++decorSeq;
  const go = () => {
    if (seq !== decorSeq) return;
    const bg = $('bg'); bg.querySelectorAll('.bubble').forEach(e => e.remove());
    const th = THEMES[curTheme], url = (!th.emo && customBubble) ? customBubble : null;
    for (let i = 0; i < (LITE ? 8 : 22); i++) {
      const b = document.createElement('div'), s = 30 + Math.random() * 130;
      let cls = 'bubble', css = 'width:' + s + 'px;height:' + s + 'px;left:' + (Math.random() * 100) + '%;' +
        'animation-duration:' + (14 + Math.random() * 18) + 's;animation-delay:-' + (Math.random() * 30) + 's;';
      if (th.emo) {
        cls += ' emo' + (th.fall ? ' fall' : '');
        b.textContent = th.emo[rnd(th.emo.length)];
        const fs = s * (th.fall ? 0.45 : 0.7);
        css += 'font-size:' + fs + 'px;line-height:' + s + 'px;';
      } else if (url) {
        cls += ' custom'; css += 'background-image:url("' + url + '");';
      }
      b.className = cls; b.style.cssText = css; bg.appendChild(b);
    }
  };
  if (customTested) { go(); return; }
  const t = new Image();                           // bulle.png facultative (ton propre visuel, fond transparent)
  t.onload = () => { customBubble = 'bulle.png'; customTested = true; go(); };
  t.onerror = () => { customTested = true; go(); };
  t.src = 'bulle.png';
}
function applyTheme() {
  const nt = themeChoice === 'auto' ? autoTheme() : themeChoice;
  const first = !document.documentElement.dataset.theme;
  document.documentElement.dataset.theme = nt;
  $('themeSel').options[0].textContent = 'Auto (actuel : ' + THEMES[autoTheme()].name + ')';
  if (first || nt !== curTheme) { curTheme = nt; buildDecor(); }
}
$('themeSel').value = themeChoice;
$('themeSel').onchange = e => {
  themeChoice = e.target.value;
  try { localStorage.setItem(THEME_KEY, themeChoice); } catch (err) {}
  applyTheme();
};
applyTheme();
fit();
initFromManifest();
</script>
